events {
    worker_connections 1024;
}

http {
    upstream monitored_backend {
        server monitored-service:8080;
    }

    # Circuit breaker state (managed by supervisor/healing agent via Redis or file)
    # Default: CLOSED (traffic flows)
    map $http_x_circuit_override $circuit_state {
        default "CLOSED";
        "OPEN" "OPEN";
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Main API proxy with circuit breaker header
        location /api/process {
            # If circuit is OPEN, return 503 immediately
            if ($circuit_state = "OPEN") {
                return 503 "Service Unavailable - Circuit Breaker OPEN";
            }

            proxy_pass http://monitored_backend/api/process;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Circuit-State $circuit_state;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Catch-all proxy
        location / {
            proxy_pass http://monitored_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Circuit-State $circuit_state;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Custom error page for circuit breaker
        error_page 503 @circuit_open;
        location @circuit_open {
            return 503 '{"error":"Circuit Breaker OPEN","status":503}';
            add_header Content-Type application/json;
        }
    }
}