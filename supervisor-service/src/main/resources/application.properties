spring.application.name=supervisor-service

# ================= LOCAL LLM CONFIG =================
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:http://host.docker.internal:8080}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:dummy-token}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:qwen-log-classifier}
spring.ai.openai.chat.options.temperature=0.0
spring.ai.openai.chat.options.max-tokens=800
spring.ai.openai.chat.options.internal-tool-execution-enabled=true
spring.ai.openai.connection-timeout=30s
spring.ai.openai.read-timeout=60s

# ================= MCP CLIENT CONFIG =================
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.request-timeout=60s

spring.ai.mcp.client.sse.connections.metrics-agent.url=${METRICS_AGENT_MCP_URL:http://metrics-agent:8080}
spring.ai.mcp.client.sse.connections.logs-agent.url=${LOGS_AGENT_MCP_URL:http://logs-agent:8080}
spring.ai.mcp.client.sse.connections.anomaly-agent.url=${ANOMALY_AGENT_MCP_URL:http://anomaly-agent:8080}
spring.ai.mcp.client.sse.connections.healing-agent.url=${HEALING_AGENT_MCP_URL:http://healing-agent:8080}

# ================= SERVICE ENDPOINTS =================
# Metrics & Logs REST targets on monitored-service
MONITORED_SERVICE_URL=${MONITORED_SERVICE_URL:http://monitored-service:8080}
HEALING_SERVICE_URL=${HEALING_SERVICE_URL:http://healing-agent:8080}

# ================= REDIS & DYNAMODB =================
spring.data.redis.host=${SPRING_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT:http://sentinel-dynamodb:8000}
aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=dummy-key
aws.secret-access-key=dummy-secret

# ================= ACTUATOR & LOGGING =================
management.endpoint.health.show-details=always
logging.level.org.springframework.ai.mcp=INFO
logging.level.org.springframework.ai=INFO